# Python Docs Samples Workflow Bulk Dependency Update Pip Requirements

## Action

Follow the bulk-dependency-update-pip-requirements workflow:
1. Identify out-of-date dependencies across all subprojects.
2. Update the relevant dependency version(s) in requirements-test.txt, requirements.txt, and constraints.txt files in each affected directory.
3. Optionally update setup.py if present.
4. Commit all changes in a single commit with a detailed message listing all updated dependencies and versions.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: **/requirements-test.txt, **/requirements.txt, **/constraints.txt

